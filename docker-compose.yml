services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next:/app/.next
      - pnpm-store:/pnpm-store
      - content_collections:/app/.content-collections
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    env_file:
      - path: .env.local
        required: false

volumes:
  node_modules:
  next:
  pnpm-store:
  content_collections:
